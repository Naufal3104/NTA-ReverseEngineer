<!DOCTYPE html>
<html>
<head><title>Layout Debug</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #fff; font-family: sans-serif; }
.main-content { display: flex; height: 400px; border: 2px solid #f00; }
.map-panel { flex: 1; background: #0a0a2a; border-right: 1px solid #333; display: flex; flex-direction: column; }
.map-container { flex: 1; position: relative; overflow: hidden; background: #111; }
canvas { width: 100%; height: 100%; display: block; }
.side-panel { width: 200px; background: #0a0a2a; }
</style>
</head>
<body>
<div class="main-content">
  <div class="map-panel" id="mapPanel">
    <div class="map-container" id="mapContainer">
      <canvas id="mapCanvas"></canvas>
    </div>
  </div>
  <div class="side-panel" id="sidePanel">
    <div>Side Panel</div>
  </div>
</div>
<div id="log" style="padding:10px;font-size:11px"></div>
<script>
function log(msg) { 
  document.getElementById('log').innerHTML += msg + '<br>'; 
  console.log(msg); 
}
const container = document.getElementById('mapContainer');
const canvas = document.getElementById('mapCanvas');
log('Container rect: ' + JSON.stringify(container.getBoundingClientRect()));
log('Container size: ' + container.clientWidth + 'x' + container.clientHeight);
log('Canvas element: ' + canvas);
log('Canvas attributes: ' + canvas.width + 'x' + canvas.height);
log('Canvas client: ' + canvas.clientWidth + 'x' + canvas.clientHeight);
const ctx = canvas.getContext('2d');
log('Has context: ' + !!ctx);
// Resize canvas to container
canvas.width = container.clientWidth;
canvas.height = container.clientHeight;
log('After resize: ' + canvas.width + 'x' + canvas.height);
ctx.fillStyle = '#2d5a2d';
ctx.fillRect(10, 10, canvas.width-20, canvas.height-20);
ctx.fillStyle = '#4ade80';
ctx.font = '20px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('Map should be visible here', canvas.width/2, canvas.height/2);
log('Drawn!');
</script>
</body>
</html>
