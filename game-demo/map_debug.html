<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTA - Map Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      color: #0f0; 
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #log { 
      padding: 10px; 
      height: 120px;
      overflow-y: auto;
      background: #111;
      border-bottom: 1px solid #0f0;
      font-size: 11px;
      white-space: pre-wrap;
    }
    #mapContainer { flex: 1; position: relative; }
    #mapCanvas { 
      display: block; 
      width: 100%; 
      height: 100%; 
      background: #000;
      border: 2px solid #0f0;
    }
  </style>
</head>
<body>
  <div id="log">[INIT] Starting...</div>
  <div id="mapContainer"><canvas id="mapCanvas"></canvas></div>

    <script src="data.js?v=2"></script>
    <script>
  (function() {
  const logEl = document.getElementById('log');
  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent += '\n[' + t + '] ' + msg;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }
  
  log('[INIT] Script start');
  
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('mapContainer');
  
  log('[INIT] Canvas element: ' + canvas);
  log('[INIT] Context: ' + ctx);
  log('[INIT] Container: ' + container);
  
  const TILE_SIZE = 40;
  let zoom = 1;
  let offset = { x: 0, y: 0 };
  let isDragging = false;
  let lastMouse = { x: 0, y: 0 };
  
  function resize() {
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    log('[RESIZE] Canvas attr: ' + canvas.width + 'x' + canvas.height + ' | Client: ' + canvas.clientWidth + 'x' + canvas.clientHeight + ' | DPR: ' + dpr);
    render();
  }
  
  function tileToScreen(col, row) {
    const cx = canvas.clientWidth / 2;
    const cy = canvas.clientHeight / 2;
    const isoX = (col - row) * (TILE_SIZE / 2) * zoom;
    const isoY = (col + row) * (TILE_SIZE / 4) * zoom;
    return { x: cx + isoX + offset.x, y: cy + isoY + offset.y };
  }
  
  function drawDebug() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    // Center crosshair
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w/2 - 20, h/2); ctx.lineTo(w/2 + 20, h/2);
    ctx.moveTo(w/2, h/2 - 20); ctx.lineTo(w/2, h/2 + 20);
    ctx.stroke();
    // Center text
    ctx.fillStyle = '#f00';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CENTER', w/2, h/2 - 25);
  }
  
  function drawTile(col, row, type, id, isCapital) {
    const pos = tileToScreen(col, row);
    const hs = TILE_SIZE * zoom;
    
    log('[DRAW] Tile ' + id + ' at (' + col + ',' + row + ') -> screen (' + Math.round(pos.x) + ',' + Math.round(pos.y) + ')');
    
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - hs);
    ctx.lineTo(pos.x + hs, pos.y);
    ctx.lineTo(pos.x, pos.y + hs);
    ctx.lineTo(pos.x - hs, pos.y);
    ctx.closePath();
    
    let color;
    if (isCapital) color = '#8B4513';
    else if (type === 'crop') color = '#2d5a2d';
    else if (type === 'wood') color = '#4a3728';
    else if (type === 'stone') color = '#3d3d3d';
    else color = '#2a2a2a';
    
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(id, pos.x, pos.y);
  }
  
  function render() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    log('[RENDER] Clearing ' + w + 'x' + h);
    
    // Always draw debug center
    drawDebug();
    
    if (!window.DATA || !window.DATA.map) {
      log('[RENDER] No DATA or map!');
      ctx.fillStyle = '#f00';
      ctx.font = '16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('NO DATA LOADED', w/2, h/2);
      return;
    }
    
    log('[RENDER] DATA loaded, plots: ' + window.DATA.map.plots.length);
    
    // Draw neutral plots
    window.DATA.map.plots.forEach(p => {
      drawTile(p.col, p.row, p.res, p.id, false);
    });
    
    // Draw capitals
    const pc = window.DATA.map.playerCapital;
    drawTile(pc.col, pc.row, 'capital', 'PC', true);
    
    const ec = window.DATA.map.enemyCapital;
    drawTile(ec.col, ec.row, 'capital', 'EC', true);
    
    log('[RENDER] Done drawing ' + (window.DATA.map.plots.length + 2) + ' tiles');
  }
  
  // Events
  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
  });
  
  canvas.addEventListener('mousemove', e => {
    if (isDragging) {
      const dx = e.clientX - lastMouse.x;
      const dy = e.clientY - lastMouse.y;
      offset.x += dx;
      offset.y += dy;
      lastMouse = { x: e.clientX, y: e.clientY };
      render();
    }
  });
  
  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('mouseleave', () => { isDragging = false; });
  
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
    render();
  });
  
  // Init
  function init() {
    log('[INIT] Window DATA exists: ' + (!!window.DATA));
    if (window.DATA) {
      log('[INIT] DATA.map exists: ' + (!!window.DATA.map));
      if (window.DATA.map) {
        log('[INIT] Plots: ' + window.DATA.map.plots.length);
        log('[INIT] Player capital: ' + JSON.stringify(window.DATA.map.playerCapital));
        log('[INIT] Enemy capital: ' + JSON.stringify(window.DATA.map.enemyCapital));
      }
    }
    resize();
    window.addEventListener('resize', resize);
    render();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
